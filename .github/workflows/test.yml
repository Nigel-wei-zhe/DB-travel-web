name: 測試

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查 JavaScript 語法
        run: |
          for file in app.js trip-data.js itinerary.js shops.js visits.js maps.js coupons.js home-preview.js icons.js sw.js dev-server.cjs; do
            node --check "$file"
          done
      - name: 執行測試
        run: node --test app.test.cjs trip-data.test.cjs maps.test.cjs visits.test.cjs sw.test.cjs
